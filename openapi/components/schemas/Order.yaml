description: Represents an order
type: object
properties:
  id:
    description: Order identifier
    type: string
    example: a7384042-e4aa-4c93-85ae-31a346dad704
  customer:
    $ref: './User.yaml'
  address:
    $ref: './Address.yaml'
  card:
    $ref: './Card.yaml'
  date:
    description: Order's data and time details
    type: string
    format: date-time
    example: 2026-04-13T23:20:50.52Z
  items:
    description: Collection of order items.
    type: array
    items:
      $ref: './Item.yaml'
  total:
    description: Order total
    type: string  # BigDecimal
    example: "38.14"
  payment:
    $ref: './Payment.yaml'
  shipment:
    $ref: './Shipment.yaml'
  status:
    description: Order Status
    type: string
    enum:
      - CREATED
      - PAID
      - SHIPPED
      - PAYMENT_FAILED
      - SHIPMENT_FAILED
      - COMPLETED
    example: CREATED
xml:
  name: Order