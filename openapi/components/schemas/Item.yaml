description: Items in shopping cart
type: object
properties:
  id:
    description: Item Identifier
    type: string
    example: a7384042-e4aa-4c93-85ae-31a346dad704
  name:
    description: Item name
    type: string
    example: Influence
  description:
    description: Item description
    type: string
    example: Influence - Psychology of Persuasion. By Robert B. Cialdini Ph.D.
  imageUrl:
    description: Item image URL
    type: string
    example: /images/Influence.jpeg
  quantity:
    description: The item quantity
    type: integer
    format: int32
    example: 1
  unitPrice:
    description: The item's price per unit
    type: number
    format: double
    example: 99.99
