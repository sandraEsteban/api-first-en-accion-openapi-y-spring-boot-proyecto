description: Contains the payment request information
type: object
properties:
  orderId:
    description: Order Identifier
    type: string
    example: 0a59ba9f-629e-4445-8129-b9bce1985d6a
  customer:
    $ref: './CustomerInfoOnCard.yaml'
  address:
    $ref: './Address.yaml'
  card:
    $ref: './Card.yaml'
