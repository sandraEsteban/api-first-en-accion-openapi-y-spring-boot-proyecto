arazzo: 1.0.1
info:
  title: Ecommerce flow test
  version: 1.0.0
  description: A sample Arazzo workflow demonstrating API orchestration

sourceDescriptions:
  - name: ecommerceApi
    url: https://github.com/sandraEsteban/api-first-en-accion-openapi-y-spring-boot-proyecto/blob/main/openapi/openapi.yaml
    type: openapi

workflows:
  - workflowId: addresses-full-lifecycle
    summary: Full CRUD test for addresses
    description: >
      Validates creation, retrieval, update, and deletion of user addresses
      using the ecommerce API.

    steps:

      # 1. CREATE ADDRESS
      - stepId: create-address
        operationId: createAddress
        source: ecommerceApi

        requestBody:
          contentType: application/json
          payload:
            number: "9I-999"
            residency: "Fraser Suites Le Claridge"
            street: "Champs-Elysees"
            city: "Paris"
            state: "Île-de-France"
            country: "France"
            pincode: "75008"
            userId: "a1b9b31d-e73c-4112-af7c-b68530f38222"

        successCriteria:
          - condition: $statusCode == 200

        outputs:
          addresses: $response.body
    
      # 2. GET ADDRESS BY ID
      - stepId: get-address
        operationId: getAddressById
        source: ecommerceApi

        parameters:
          - name: 
            in: path
            value: $steps.create-address.outputs.addresses.id

        successCriteria:
          - condition: $statusCode == 200

